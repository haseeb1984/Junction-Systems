name: Quality checks

on:
  push:
    branches:
      - main
      - "implementation/**"
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint every PHP file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Run dependency-free smoke tests
        run: php tests/smoke.php

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js bundled-plugins -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Check inline POS JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          php -r '$source = file_get_contents("templates/pos/pos-app.php"); preg_match_all("~<script\\b[^>]*>(.*?)</script>~is", $source, $matches); if (empty($matches[1])) { fwrite(STDERR, "POS inline script not found.\\n"); exit(1); } $javascript = implode("\\n", $matches[1]); $javascript = preg_replace("~<\\?(?:php|=).*?\\?>~s", "null", $javascript); file_put_contents(sys_get_temp_dir() . "/junction-pos-inline.js", $javascript);'
          node --check "$(php -r 'echo sys_get_temp_dir() . "/junction-pos-inline.js";')"
